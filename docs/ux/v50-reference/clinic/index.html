<script>
(() => {
  const pages=[...document.querySelectorAll('[data-page]')];
  const links=[...document.querySelectorAll('[data-route-link]')];
  const fallback='clinic-workspace';
  const titles={
    'clinic-workspace':'Сводка клиники','clinic-appointments':'Записи клиники','clinic-schedule':'Слоты и расписание','clinic-patients':'Пациенты','clinic-patient':'Карточка пациента','clinic-visit':'Приём и лечение','clinic-telemed':'Телемедицина','clinic-staff':'Сотрудники','clinic-services':'Услуги и цены','clinic-profile':'Профиль клиники','clinic-quality':'Качество и SLA','clinic-settings':'Настройки','clinic-notifications':'Уведомления'
  };
  function route(){const r=(location.hash||'#'+fallback).slice(1);return pages.some(p=>p.dataset.page===r)?r:fallback;}
  function render(){const r=route();pages.forEach(p=>p.classList.toggle('active',p.dataset.page===r));links.forEach(a=>{const on=a.getAttribute('href')==='#'+r || (r==='clinic-patient'&&a.getAttribute('href')==='#clinic-patients');a.classList.toggle('active',on);if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});document.title='VetHelp Clinic — '+(titles[r]||'V50');window.scrollTo({top:0,behavior:'instant'});}
  window.addEventListener('hashchange',render);document.addEventListener('DOMContentLoaded',()=>{if(!location.hash)history.replaceState(null,'','#'+fallback);render();});
})();
</script>
