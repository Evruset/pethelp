name: Owner R2F Code Gates

# Temporary CI-only harness. Do not merge.
on:
  pull_request:
    paths:
      - '.github/workflows/owner-app.yml'
      - 'apps/owner-app/**'

permissions:
  contents: read

concurrency:
  group: owner-r2f-code-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/owner-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact dependencies
        run: npm ci
      - name: Record baseline Expo drift
        continue-on-error: true
        run: npx expo-doctor
      - name: Record baseline lint drift
        continue-on-error: true
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Focused Owner tests
        run: npm test -- --ci --runInBand --forceExit
      - name: Validate test and pilot public config
        run: |
          VETHELP_ENV=test EXPO_PUBLIC_API_BASE_URL=https://test-api.vethelp.local npx expo config --type public >/tmp/owner-test-config.json
          VETHELP_ENV=pilot EXPO_PUBLIC_API_BASE_URL=https://api.vethelp.local npx expo config --type public >/tmp/owner-pilot-config.json
      - name: Validate native prebuild
        run: |
          rm -rf /tmp/owner-prebuild
          cp -R . /tmp/owner-prebuild
          cd /tmp/owner-prebuild
          VETHELP_ENV=local EXPO_PUBLIC_API_BASE_URL=http://127.0.0.1:3000 npx expo prebuild --no-install --platform android
