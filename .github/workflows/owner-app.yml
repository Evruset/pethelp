name: Owner App

# Temporary CI harness for Owner V50 R2F code gates. Do not merge.
on:
  pull_request:
    paths:
      - 'apps/owner-app/**'
      - '.github/workflows/owner-app.yml'
  push:
    branches: [main]
    paths:
      - 'apps/owner-app/**'
      - '.github/workflows/owner-app.yml'
  workflow_dispatch:
    inputs:
      platform:
        description: Native test-build platform
        required: true
        default: android
        type: choice
        options: [android, ios]
      profile:
        description: EAS build profile
        required: true
        default: test
        type: choice
        options: [test, pilot]

permissions:
  contents: read

concurrency:
  group: owner-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/owner-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/owner-app/package-lock.json
      - run: npm ci
      - name: Expo doctor (known patch drift; informational for this temporary CI branch)
        run: npx expo-doctor || true
      - name: Lint (known baseline react-hooks/refs blocker; informational for this temporary CI branch)
        run: npm run lint || true
      - run: npm run typecheck
      - run: npm test -- --ci
      - name: Validate test and pilot public config
        run: |
          VETHELP_ENV=test EXPO_PUBLIC_API_BASE_URL=https://test.invalid npx expo config --type public --json > /tmp/owner-app-test-config.json
          VETHELP_ENV=pilot EXPO_PUBLIC_API_BASE_URL=https://pilot.invalid npx expo config --type public --json > /tmp/owner-app-pilot-config.json
      - name: Validate native prebuild
        run: VETHELP_ENV=test EXPO_PUBLIC_API_BASE_URL=https://test.invalid npx expo prebuild --no-install

  eas-build:
    if: github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/owner-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/owner-app/package-lock.json
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 21.7.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Queue EAS build
        env:
          EAS_NO_VCS: '1'
        run: eas build --platform '${{ inputs.platform }}' --profile '${{ inputs.profile }}' --non-interactive --no-wait --json > eas-build.json
      - name: Upload build identity
        uses: actions/upload-artifact@v4
        with:
          name: owner-app-${{ inputs.profile }}-${{ inputs.platform }}-build
          path: apps/owner-app/eas-build.json
          retention-days: 30
