name: One-time Owner SDK 57 Lockfile Refresh

on:
  push:
    branches:
      - agent/product-batch-01-eg0mppwf
    paths:
      - apps/owner-app/package.json
      - .github/workflows/owner-lockfile-refresh-checkpoint.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'Evruset/pethelp' && github.ref == 'refs/heads/agent/product-batch-01-eg0mppwf'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh lockfile against exact SDK patch dependencies
        working-directory: apps/owner-app
        run: |
          # Regenerate from the updated direct dependencies in this disposable CI checkout.
          # Keeping the stale SDK 57 lock graph would retain an incompatible jest preset peer.
          rm package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts
          npx expo-doctor
      - name: Commit lockfile only
        run: |
          git add apps/owner-app/package-lock.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No lockfile changes required'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(owner): synchronize Expo SDK 57 patch lockfile"
          git push origin HEAD:refs/heads/agent/product-batch-01-eg0mppwf
