name: Owner V50 R2F Visual Review

on:
  push:
    branches:
      - ci/owner-v50-r2f-visual-9139bb8

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert exact application source
        run: |
          set -euo pipefail
          git cat-file -e 9139bb8b9c35fe468df9b00d819c11de8ce12d1f^{commit}
          git diff --exit-code 9139bb8b9c35fe468df9b00d819c11de8ce12d1f HEAD -- apps/owner-app
          echo EXACT_9139BB8_APP_TREE=PASS

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/owner-app/package-lock.json

      - name: Install app dependencies
        working-directory: apps/owner-app
        run: npm ci

      - name: Export exact web bundle
        working-directory: apps/owner-app
        env:
          VETHELP_ENV: test
          EXPO_PUBLIC_API_BASE_URL: https://api.visual.invalid
        run: |
          npx expo export --platform web
          echo '--- dist route files ---'
          find dist -maxdepth 2 -type f -print | sort

      - name: Install Chromium harness
        run: |
          mkdir -p /tmp/pw
          npm install --prefix /tmp/pw --no-save playwright@1.55.0
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium

      - name: Serve bundle with extensionless route rewrite
        working-directory: apps/owner-app
        run: |
          cat >/tmp/owner-static-server.py <<'PY'
          from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler
          import os
          from urllib.parse import urlsplit

          os.chdir('dist')

          class Handler(SimpleHTTPRequestHandler):
              def do_GET(self):
                  parsed = urlsplit(self.path)
                  translated = self.translate_path(parsed.path)
                  if not os.path.exists(translated) and os.path.isfile(translated + '.html'):
                      self.path = parsed.path + '.html' + (('?' + parsed.query) if parsed.query else '')
                  return super().do_GET()

          ThreadingHTTPServer(('127.0.0.1', 4173), Handler).serve_forever()
          PY
          python3 /tmp/owner-static-server.py >/tmp/owner-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS 'http://127.0.0.1:4173/(app)' >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/owner-http.log
          exit 1

      - name: Capture desktop and mobile journeys
        env:
          NODE_PATH: /tmp/pw/node_modules
        run: node .github/owner-v50-r2f-visual-review.cjs

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-v50-r2f-visual-9139bb8
          path: visual-evidence
          if-no-files-found: warn
          retention-days: 14
